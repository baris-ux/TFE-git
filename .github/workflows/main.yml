# ce code ainsi que les commentaire en anglais proviennent de la documentation officielle de tauri
# vous pouvez le trouvez à l'adresse suivant : https://v2.tauri.app/fr/distribute/pipelines/github/
# j'ai cependant du apporter des mofication pour que le worfklow githubAction correspondent au besoin de mon projets

name: "publish"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    #branches:
    #  - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm" # Only available in public repos.
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm" # Set this to npm, yarn or pnpm. ==> pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # This matches tauri's default project layout. Change this if you have a different layout.
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        # If you don't have `beforeBuildCommand` configured you may want to build your frontend here too.
        run: pnpm install # change this to npm, yarn or pnpm depending on which one you use. ==> ok

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "App ${{ github.ref_name }}"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true # ici on le met false, en true la release ne sera pas publique c'est à dire que seul moi et les collaborateurs du répo pourront voir la release
          prerelease: true
          args: ${{ matrix.args }}
          updateRelease:
            false # cela permet à ce que si une vm finit de créer un dossier de release en premier,
            # les autre vm puisse créer un dossier de release avec le même nom de version
            # sans ca impossible car la 2e 3e 4e ... VM va dire que le dossier existe déja !
